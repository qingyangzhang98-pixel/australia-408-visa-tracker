```yaml
name: 🇦🇺 408 Visa ImmiAccount Reminder

on:
  schedule:
    # 10:00 Beijing time, Monday-Friday
    # GitHub cron uses UTC: 02:00 UTC = 10:00 Asia/Shanghai
    - cron: "0 2 * * 1-5"

  # Allow manual testing
  workflow_dispatch:

permissions:
  issues: write

jobs:
  immiaccount-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether today is a reminder day
        id: schedule_check
        shell: bash
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)

          RUN_REMINDER=$(python3 - <<'PY'
          from datetime import date, timedelta

          # First scheduled post-lodgement reminder
          anchor = date(2026, 8, 27)
          today = date.today()

          # GitHub runner uses UTC, but the cron fires at 02:00 UTC,
          # which is already the same calendar day in China.
          if today < anchor or today.weekday() >= 5:
              print("false")
              raise SystemExit

          # Count business days from anchor to today.
          d = anchor
          business_index = 0

          while d < today:
              d += timedelta(days=1)
              if d.weekday() < 5:
                  business_index += 1

          # Reminder every other business day:
          # Thu -> Mon -> Wed -> Fri -> Tue -> ...
          print("true" if business_index % 2 == 0 else "false")
          PY
          )

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "run_reminder=$RUN_REMINDER" >> "$GITHUB_OUTPUT"

          echo "Today: $TODAY"
          echo "Run reminder: $RUN_REMINDER"

      - name: Add ImmiAccount reminder to monitoring issue
        if: steps.schedule_check.outputs.run_reminder == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          DATE="${{ steps.schedule_check.outputs.today }}"

          gh issue comment 8 \
            --repo "$GH_REPO" \
            --body "🔔 **408 Visa — ImmiAccount Check | $DATE**

          Please log in to ImmiAccount and check:

          - Application status
          - New Messages
          - Request for Information / further documents
          - Newly requested attachment categories
          - Health or character requests
          - Any response deadline

          If nothing has changed, no action is required.

          This is a post-lodgement monitoring reminder only."

      - name: Skip reminder
        if: steps.schedule_check.outputs.run_reminder != 'true'
        run: |
          echo "Not a scheduled reminder day. No GitHub note created."
